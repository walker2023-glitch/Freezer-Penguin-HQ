name: Flutter CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_mobile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze 2>&1 | tee analyze.log
          exit ${PIPESTATUS[0]}

      - name: Publish analyzer diagnostics
        if: steps.analyze.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('frontend_mobile/analyze.log', 'utf8');
            const body = 'Flutter analyzer diagnostics for this commit:\n\n```text\n' + log.slice(-12000) + '\n```';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail when analyzer reports issues
        if: steps.analyze.outcome == 'failure'
        run: exit 1
