name: Freezer Penguin — CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Linter (Flake8)
        id: lint
        continue-on-error: true
        run: |
          pip install flake8
          flake8 backend/app/ --max-line-length=120 > flake8-report.txt 2>&1
          status=$?
          cat flake8-report.txt
          exit $status

      - name: Publish linter diagnostics
        if: steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('flake8-report.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Temporary Flake8 diagnostics for this branch:\n\n' + report
            });

      - name: Fail if linter failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Run Test Suite
        env:
          GEMINI_API_KEY: "test-ci-placeholder"
          DATABASE_URL: "sqlite:///./test_ci.db"
          AUTH_TOKEN_SECRET: "test-only-auth-secret"
        run: |
          pip install pytest pydantic
          python -m pytest backend/app/tests/ --tb=short --verbose

      - name: Zip Build Artifacts
        run: |
          zip -r backend-build-artifact.zip backend/ -x "**/__pycache__/*"

      - name: Upload Pipeline Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-artifact
          path: backend-build-artifact.zip
          retention-days: 30
